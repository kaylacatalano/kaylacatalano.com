<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayla Catalano | Contact</title>

  <link rel="preload" href="vineyard.mp4" as="video" type="video/mp4">
  <link rel="icon" type="image/png" href="favicon-v2.png">
  <link rel="apple-touch-icon" href="/favicon-v2.png">

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
}

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

 .video-frame {
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  margin: 0 auto 0px auto;
  background: #0f0f0f;
}

.video-frame video {
  height: 100%;
  width: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  transform: scale(0.65);
}
    
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: -15px;
    }

    input,
    textarea {
      background: transparent;
      border: 1px solid #333;
      color: white;
      padding: 12px;
      font-size: 14px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: white;
      color: black;
      border: none;
      padding: 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #888;
      text-decoration: none;
    }

    .back:hover {
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="video-frame">
  <video autoplay muted loop playsinline>
    <source src="vineyard.mp4" type="video/mp4">
  </video>
</div>

    <form action="https://formspree.io/f/mykapyea" method="POST">

      <input
        type="text"
        name="name"
        placeholder="name"
        required
      >

      <input
        type="email"
        name="email"
        placeholder="email"
        required
      >

      <textarea
        name="message"
        placeholder="message"
        required
      ></textarea>

      <button type="submit">
        send
      </button>

    </form>

    <a class="back" href="/">
      ← back
    </a>

  </div>

</body>
</html>
