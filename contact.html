<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayla Catalano | Contact</title>

  <link rel="preload" href="vineyard.mp4" as="video" type="video/mp4">
  <link rel="icon" type="image/png" href="favicon-v2.png">
  <link rel="apple-touch-icon" href="/favicon-v2.png">

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    .video-frame {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      margin: 0 auto;
      background: #0f0f0f;
    }

    .video-frame video {
      height: 100%;
      width: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(0.65);
    }

    .email-link {
      display: inline-block;
      margin-top: 18px;
      color: white;
      text-decoration: none;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .email-link:hover {
      color: #888;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #888;
      text-decoration: none;
    }

    .back:hover {
      color: white;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="video-frame">
      <video autoplay muted loop playsinline>
        <source src="vineyard.mp4" type="video/mp4">
      </video>
    </div>

    <br>


  </div>
</body>
</html>
