  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .scene {
      position: absolute;
    }

    .video-scene {
      opacity: 1;
      animation: videoIntro 7s forwards;
    }

    .text-scene {
      opacity: 0;
      animation: textReveal 7s forwards;
    }

    .video-frame {
      width: 90vw;
      max-width: 650px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      position: relative;
      background: #0f0f0f;
    }

    .shutter {
  position: absolute;
  left: 0;
  width: 100%;
  height: 0%;
  background: #0f0f0f;
  z-index: 2;
  pointer-events: none;
  animation: shutterClose 7s forwards;
}

.top-shutter {
  top: 0;
}

.bottom-shutter {
  bottom: 0;
}

    .video-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(0.65);
    }

    h1 {
      font-weight: 400;
      letter-spacing: 2px;
    }

    .cursor::after {
      content: "|";
      animation: blink 1s infinite;
    }

    a {
      color: white;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.7;
    }
    
  @keyframes blink {
  50% {
    opacity: 0;
  }
}
   @keyframes videoIntro {
  0% { opacity: 1; }
  70% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes textReveal {
  0% { opacity: 0; }
  85% { opacity: 0; }
  100% { opacity: 1; }
}

    @keyframes shutterClose {
  0% { height: 0%; }
  70% { height: 0%; }
  100% { height: 50%; }
}
    
  </style>
</head>

<body>

<div class="scene video-scene">
  <div class="video-frame">
    <video autoplay muted loop playsinline>
      <source src="vineyard.mp4" type="video/mp4">
    </video>

    <div class="shutter top-shutter"></div>
    <div class="shutter bottom-shutter"></div>
  </div>
</div>

  <div class="scene text-scene">
    <h1 class="cursor">under construction</h1>
    <p>
      <a href="mailto:kaylamcatalano@gmail.com">contact</a>
    </p>
  </div>

  }
  </script>

</body>
